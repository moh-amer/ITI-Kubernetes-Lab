apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: work-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pvc-lab
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - name: work-volume
      mountPath: /data
  volumes:
  - name: work-volume
    persistentVolumeClaim:
      claimName: work-pvc
