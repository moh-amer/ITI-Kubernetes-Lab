apiVersion: v1
kind: ConfigMap
metadata:
  name: site-html
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Lab 03</title>
    </head>
    <body>
        <h1>Welcome to ITI Volumes</h1>
        <p>This is a custom homepage loaded from a ConfigMap!</p>
    </body>
    </html>
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-site
spec:
  containers:
  - name: nginx
    image: nginx:1.27
    volumeMounts:
    - name: html-volume
      mountPath: /usr/share/nginx/html
  volumes:
  - name: html-volume
    configMap:
      name: site-html
