apiVersion: v1
kind: Pod
metadata:
  name: hostpath-lab
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - name: host-volume
      mountPath: /data
  volumes:
  - name: host-volume
    hostPath:
      path: /tmp/hostpath-lab
      type: DirectoryOrCreate
