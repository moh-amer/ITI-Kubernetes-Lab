apiVersion: v1
kind: Secret
metadata:
  name: api-creds
type: Opaque
stringData:
  token: "iti-token-42"
  user: "student"
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-files
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - name: cred-volume
      mountPath: /etc/api
      readOnly: true
  volumes:
  - name: cred-volume
    secret:
      secretName: api-creds
      defaultMode: 0400
