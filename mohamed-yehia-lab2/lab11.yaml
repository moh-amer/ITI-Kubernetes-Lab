apiVersion: v1
kind: Pod
metadata:
  name: files-pod
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - name: config-vol
      mountPath: /etc/files
      readOnly: true
  volumes:
  - name: config-vol
    configMap:
      name: files-cm
