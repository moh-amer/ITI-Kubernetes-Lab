apiVersion: v1
kind: Pod
metadata:
  name: hostpath-lab
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command:
      - sh
      - -c
      - sleep 3600
    volumeMounts:
    - name: host-storage
      mountPath: /data

  volumes:
  - name: host-storage
    hostPath:
      path: /tmp/hostpath-lab
      type: DirectoryOrCreate

      # the diffrent that now the files are on the node علي المكنه مش علي البود