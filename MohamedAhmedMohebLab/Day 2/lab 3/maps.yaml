apiVersion: v1
kind: ConfigMap
metadata:
  name: site-html

data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head>
        <title>ITI</title>
      </head>
      <body>
        <h1>ITI Volumes</h1>
        <p>Welcome to Kubernetes ConfigMap Volume Lab.</p>
      </body>
    </html>

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-site

spec:
  containers:
  - name: nginx
    image: nginx:1.27

    volumeMounts:
    - name: html-volume
      mountPath: /usr/share/nginx/html

  volumes:
  - name: html-volume
    configMap:
      name: site-html