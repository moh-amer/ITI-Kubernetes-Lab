apiVersion: v1
kind: Secret

metadata:
  name: app-license

type: Opaque

stringData:
  license-key: "5ecur3"

---
apiVersion: v1
kind: Pod

metadata:
  name: secret-demo

spec:
  containers:
    - name: secret-demo
      image: busybox:latest

      command:
        - /bin/sh
        - -c
        - |
          while true
          do
            sleep 3600
          done

      env:
        - name: LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: app-license
              key: license-key
