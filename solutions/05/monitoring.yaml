apiVersion: v1
kind: Namespace
metadata:
  name: datacenter
spec: {}
status: {}
---
apiVersion: v1
data:
  TIME_FREQ: "11"
kind: ConfigMap
metadata:
  name: time-config
  namespace: datacenter
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: time-check
  name: time-check
  namespace: datacenter
spec:
  containers:
  - image: busybox
    name: time-check
    command: ["/bin/sh", "-c"]
    args: ["while true; do date; sleep $TIME_FREQ; done"]
    env:
    - name: TIME_FREQ
      valueFrom:
        configMapKeyRef:
          name: time-config
          key: TIME_FREQ
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
