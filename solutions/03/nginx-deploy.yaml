apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx
    send: help
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
      send: help
  strategy: {}
  template:
    metadata:
      labels:
        app: nginx
        send: help
    spec:
      containers:
      - image: nginx
        name: nginx
        resources: {}
status: {}
