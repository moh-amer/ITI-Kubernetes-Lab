apiVersion: v1
kind: Pod
metadata:
  name: print-envars-greeting
spec:
  restartPolicy: Never
  containers:
  - name: print-env-container
    image: bash:latest
    env:
    - name: GREETING
      value: "Welcome to"
    - name: COMPANY
      value: "ITI"
    - name: GROUP
      value: "DevOps"
    command: ["bash", "-c", "echo $GREETING $COMPANY $GROUP"]
