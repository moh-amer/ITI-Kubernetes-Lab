apiVersion: v1
kind: Secret
metadata:
  name: app-license
type: Opaque
stringData:
  license-key: "5ecur3"
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
spec:
  containers:
  - name: busybox
    image: busybox:latest
    # Keep the container running so we can exec into it
    command: ["/bin/sh", "-c", "sleep 3600"]
    env:
    - name: LICENSE_KEY
      valueFrom:
        secretKeyRef:
          name: app-license
          key: license-key
