apiVersion: v1
data:
  key.json: 
kind: Secret
metadata:
  name: gcp-service-account

---
apiVersion: v1
kind: Pod
metadata:
  name: secret-vol
  labels:
    demo: secret-volume
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: creds
          mountPath: /etc/creds
          readOnly: true
  volumes:
    - name: creds
      secret:
        secretName: gcp-service-account
        defaultMode: 0400
