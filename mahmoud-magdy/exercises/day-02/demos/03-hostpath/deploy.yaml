apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostpath-demo-2
  labels:
    demo: hostpath
spec:
  replicas: 3
  selector:
    matchLabels:
      demo: hostpath
  template:
    metadata:
      labels:
        demo: hostpath
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: nodedata
              mountPath: /data
      volumes:
        - name: nodedata
          hostPath:
            path: /tmp/data
            type: DirectoryOrCreate
