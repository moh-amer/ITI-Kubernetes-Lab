apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  labels:
    demo: emptydir
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo $(hello world) $(date) >> /logs/app.log; sleep 1; done"]
      volumeMounts:

        - name: logs
          mountPath: /logs

    - name: sidecar
      image: busybox:1.36
      command: ["sh", "-c", "tail -f /logs/app.log"]
      volumeMounts:
        - name: logs
          mountPath: /logs
  volumes:
    - name: logs
      emptyDir: {}