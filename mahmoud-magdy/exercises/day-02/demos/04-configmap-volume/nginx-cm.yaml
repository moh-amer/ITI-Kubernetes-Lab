apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html
data:
  index.html: |
    <h1>Hello from ConfigMap</h1>
    <p>No image rebuild required.</p>
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-cm
  labels:
    demo: configmap-volume
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      volumeMounts:
        - name: hamada
          mountPath: /usr/share/nginx/html
          
  volumes:
    - name: hamada
      configMap:
        name: nginx-html
