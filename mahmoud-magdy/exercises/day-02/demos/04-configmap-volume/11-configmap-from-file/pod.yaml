apiVersion: v1
kind: Pod
metadata:
  name: cm-from-file
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "cat /etc/config/app.conf; cat /etc/config/welcome.txt; sleep 3600"]
      volumeMounts:
        - name: config
          mountPath: /etc/config
          readOnly: true
  volumes:
    - name: config
      configMap:
        name: app-files
