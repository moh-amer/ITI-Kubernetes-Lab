apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-demo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # Required: disable dynamic provisioning so we bind the static PV.
  storageClassName: ""
  volumeName: static-demo-pv
---
apiVersion: v1
kind: Pod
metadata:
  name: static-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: static-demo-pvc
