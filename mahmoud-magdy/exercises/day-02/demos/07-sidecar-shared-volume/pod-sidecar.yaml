apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
  labels:
    demo: sidecar
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - while true; do date >> /data/out.txt; sleep 2; done
      volumeMounts:
        - name: share
          mountPath: /data
    - name: reader
      image: busybox:1.36
      command:
        - sh
        - -c
        - tail -F /data/out.txt
      volumeMounts:
        - name: share
          mountPath: /data
  volumes:
    - name: share
      emptyDir: {}
